[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcrp-scraping"
version = "0.1.0-alpha"
description = "Sistema de scraping reutilizable para BCRP Estudios Económicos"
requires-python = ">=3.11"
authors = [{ name = "Donny — BCRP Arequipa" }]
dependencies = [
    "selenium>=4.18",
    "undetected-chromedriver>=3.5",
    "pydantic>=2.6",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
analisis = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
]
pdf = [
    "pymupdf>=1.24",
]

[tool.setuptools.packages.find]
include = ["core*", "plantilla_proyecto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
